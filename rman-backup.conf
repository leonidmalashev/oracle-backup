# --
# rman-backup.conf - common RMAN backup configuration.
# Per-database files may override variables after this file is sourced.
# --
# $Id: rman-backup.conf leonid.malashev@gmail.com $
#-------------------------------------------------------------------------------

export NLS_LANG="AMERICAN_AMERICA.UTF8"
export NLS_DATE_FORMAT="YYYY-MM-DD HH24:MI:SS"
#export NLS_TIME_FORMAT="HH24:MI:SSXFF"

AL_FILESPERSET=${AL_FILESPERSET:-5}
DB_FILESPERSET=${DB_FILESPERSET:-1}
DB_SECTION_SIZE=${DB_SECTION_SIZE:-8G}

RMAN_AFTER_CONNECT=${RMAN_AFTER_CONNECT:-}
RMAN_AFTER_CONNECT_DATABASE_I0=${RMAN_AFTER_CONNECT_DATABASE_I0:-$RMAN_AFTER_CONNECT}
RMAN_AFTER_CONNECT_DATABASE_I1=${RMAN_AFTER_CONNECT_DATABASE_I1:-$RMAN_AFTER_CONNECT}
RMAN_AFTER_CONNECT_ARCHIVELOG=${RMAN_AFTER_CONNECT_ARCHIVELOG:-$RMAN_AFTER_CONNECT}
RMAN_AFTER_CONNECT_RESTORE_VALIDATE=${RMAN_AFTER_CONNECT_RESTORE_VALIDATE:-$RMAN_AFTER_CONNECT}

RMAN_CROSSCHECK_BACKUP_LINE=${RMAN_CROSSCHECK_BACKUP_LINE:-"  CROSSCHECK BACKUP;"}
RMAN_CROSSCHECK_ARCHIVELOG_LINE=${RMAN_CROSSCHECK_ARCHIVELOG_LINE:-"  CROSSCHECK ARCHIVELOG ALL;"}
RMAN_DELETE_EXPIRED_BACKUP_LINE=${RMAN_DELETE_EXPIRED_BACKUP_LINE:-"  DELETE NOPROMPT EXPIRED BACKUP;"}
RMAN_DELETE_EXPIRED_ARCHIVELOG_LINE=${RMAN_DELETE_EXPIRED_ARCHIVELOG_LINE:-"  DELETE NOPROMPT EXPIRED ARCHIVELOG ALL;"}
RMAN_DELETE_OBSOLETE_LINE=${RMAN_DELETE_OBSOLETE_LINE:-"  DELETE NOPROMPT OBSOLETE;"}
RMAN_ARCHIVELOG_DELETE_LINE=${RMAN_ARCHIVELOG_DELETE_LINE:-"    DELETE INPUT;"}

#-------------------------------------------------------------------------------
function write_rman_header {
    local arg_backup_tag=$1
    local arg_after_connect=${2:-}

    cat << EOF
CONNECT TARGET /
EOF
    if [[ -n $arg_after_connect ]]; then
        printf '%s\n' "$arg_after_connect"
    fi
    cat << EOF
RUN {
  SET COMMAND ID TO '$arg_backup_tag';
EOF
}

function write_rman_footer {
    cat << EOF
}
EXIT;
EOF
}

function write_rman_crosscheck_all {
    printf '%s\n' \
        "$RMAN_CROSSCHECK_BACKUP_LINE" \
        "$RMAN_CROSSCHECK_ARCHIVELOG_LINE" \
        "$RMAN_DELETE_EXPIRED_BACKUP_LINE" \
        "$RMAN_DELETE_EXPIRED_ARCHIVELOG_LINE"
}

function write_rman_crosscheck_archivelog {
    printf '%s\n' \
        "$RMAN_CROSSCHECK_ARCHIVELOG_LINE" \
        "$RMAN_DELETE_EXPIRED_ARCHIVELOG_LINE"
}

function write_rman_database_backup {
    local arg_backup_tag=$1
    local arg_job_name=$2
    local arg_level=$3
    local arg_cumulative=${4:-}

    cat << EOF
  BACKUP AS COMPRESSED BACKUPSET INCREMENTAL LEVEL = ${arg_level}
${arg_cumulative}    FILESPERSET = ${DB_FILESPERSET}
    SECTION SIZE = ${DB_SECTION_SIZE}
    TAG '$arg_backup_tag'
    DATABASE
    FORMAT '${_base_backup_dir}/${_oracle_sid}/%d_${arg_job_name}_%T_%U';
EOF
}

function write_rman_archivelog_backup {
    local arg_backup_tag=$1
    local arg_not_backed_up=${2:-}

    cat << EOF
  SQL 'ALTER SYSTEM ARCHIVE LOG CURRENT';
  BACKUP AS COMPRESSED BACKUPSET ARCHIVELOG ALL
    FILESPERSET = ${AL_FILESPERSET}
    TAG '$arg_backup_tag'
${arg_not_backed_up}    FORMAT '${_base_backup_dir}/${_oracle_sid}/%d_al_%T_%U'
${RMAN_ARCHIVELOG_DELETE_LINE}
EOF
}

function write_rman_obsolete_and_metadata {
    local arg_backup_tag=$1

    cat << EOF
${RMAN_DELETE_OBSOLETE_LINE}
  BACKUP CURRENT CONTROLFILE
    TAG '$arg_backup_tag'
    FORMAT '${_base_backup_dir}/${_oracle_sid}/%d_cf_%T_%U';
  BACKUP SPFILE
    TAG '$arg_backup_tag'
    FORMAT '${_base_backup_dir}/${_oracle_sid}/%d_spf_%T_%U';
EOF
}

function create_rman_backup_database_script {
    local arg_file_name=$1
    local arg_backup_tag=$2
    local arg_job_name=$3
    local arg_level=$4
    local arg_cumulative=${5:-}
    local arg_after_connect=${6:-}

    {
        write_rman_header "$arg_backup_tag" "$arg_after_connect"
        write_rman_crosscheck_all
        write_rman_database_backup "$arg_backup_tag" "$arg_job_name" "$arg_level" "$arg_cumulative"
        write_rman_archivelog_backup "$arg_backup_tag"
        write_rman_obsolete_and_metadata "$arg_backup_tag"
        write_rman_footer
    } > "$arg_file_name"
}

function create_rman_backup_database_i0_script {
    create_rman_backup_database_script "$1" "$2" "$3" 0 "" "$RMAN_AFTER_CONNECT_DATABASE_I0"
}

function create_rman_backup_database_i1_script {
    create_rman_backup_database_script "$1" "$2" "$3" 1 $'    CUMULATIVE\n' "$RMAN_AFTER_CONNECT_DATABASE_I1"
}

function create_rman_backup_archivelog_script {
    local arg_file_name=$1
    local arg_backup_tag=$2

    {
        write_rman_header "$arg_backup_tag" "$RMAN_AFTER_CONNECT_ARCHIVELOG"
        write_rman_crosscheck_archivelog
        write_rman_archivelog_backup "$arg_backup_tag" $'    NOT BACKED UP 1 TIMES\n'
        write_rman_footer
    } > "$arg_file_name"
}

function create_rman_restore_database_validate_script {
    local arg_file_name=$1
    local arg_backup_tag=$2

    {
        write_rman_header "$arg_backup_tag" "$RMAN_AFTER_CONNECT_RESTORE_VALIDATE"
        cat << EOF
  RESTORE DATABASE VALIDATE;
  RESTORE SPFILE FROM AUTOBACKUP VALIDATE;
  RESTORE CONTROLFILE FROM AUTOBACKUP VALIDATE;
  #Error RESTORE ARCHIVELOG ALL VALIDATE;
EOF
        write_rman_footer
    } > "$arg_file_name"
}
